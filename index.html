<style>
/* Layout: one full-screen arcade cabinet. Globe of pixel tiles in the middle, HUD in the corners, item window on click. */
:root {
  --night: #0e0c1b;
  --panel: #191530;
  --ink: #f3ecdc;
  --dim: #7d7799;
  --red: #e3242b;
  --gold: #f2c14e;
  --display: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --body: "VT323", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 20px;
  overflow: hidden;
  -webkit-font-smoothing: none;
}
.cabinet {
  position: relative;
  height: 100%;
  padding-inline: 16px;
  box-sizing: border-box;
  background:
    radial-gradient(ellipse at 50% 55%, #221c44 0%, var(--night) 62%);
}
.cabinet::after { /* CRT scanlines */
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
  z-index: 50;
}

/* HUD */
.hud {
  position: absolute; left: 16px; right: 16px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  flex-wrap: wrap;
  z-index: 40;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud.top { top: 20px; }
.hud.bottom { bottom: 18px; align-items: flex-end; }
.logo h1 {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(14px, 2.4vw, 24px);
  line-height: 1.4;
  letter-spacing: .02em;
  text-shadow: 3px 3px 0 var(--red);
}
.logo p { margin: 6px 0 0; color: var(--dim); font-size: 20px; letter-spacing: .06em; }
.score {
  font-family: var(--display);
  font-size: 11px;
  text-align: right;
  line-height: 2;
  color: var(--dim);
}
.score b { color: var(--gold); font-weight: 400; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip, .pixbtn {
  font-family: var(--display);
  font-size: 10px;
  color: var(--ink);
  background: var(--panel);
  border: 0;
  padding: 9px 11px 8px;
  cursor: pointer;
  box-shadow: inset 0 0 0 2px var(--dim), 3px 3px 0 #000;
}
.chip[style*="--tc"]::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--tc); vertical-align: 0; }
.chip[aria-pressed="true"] { background: var(--red); box-shadow: inset 0 0 0 2px var(--ink), 3px 3px 0 #000; }
.chip:hover, .pixbtn:hover { box-shadow: inset 0 0 0 2px var(--ink), 3px 3px 0 #000; }
.chip:active, .pixbtn:active { transform: translate(2px, 2px); box-shadow: inset 0 0 0 2px var(--ink), 1px 1px 0 #000; }
.chip:focus-visible, .pixbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.hint {
  font-family: var(--display);
  font-size: 10px;
  color: var(--dim);
  text-align: right;
  line-height: 2;
}
.zoom { display: inline-flex; gap: 6px; margin-top: 6px; }
.zoom .pixbtn { min-width: 34px; }
.hint .blink { color: var(--ink); animation: blink 1.1s steps(1) infinite; }
.hint a { color: var(--dim); }
@keyframes blink { 50% { opacity: 0; } }

/* Globe */
.stage {
  position: absolute; inset: 0;
  z-index: 1;             /* own stacking context so tile z-indexes stay under the HUD and card */
  touch-action: none;
  cursor: grab;
  user-select: none;
}
.stage.dragging { cursor: grabbing !important; }
.stage canvas { display: block; width: 100%; height: 100%; }
.tier-labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.tier-labels span {
  position: absolute; left: 0; top: 0;
  font-family: var(--display); font-size: 11px; letter-spacing: .08em; white-space: nowrap;
  color: var(--ink); transform-origin: 0 100%;
}
.tier-labels span i { display: inline-block; width: 9px; height: 9px; margin-right: 8px; background: var(--tc); box-shadow: 0 0 0 2px #000; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 12px; color: var(--dim); text-align: center; padding: 16px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sr-only:focus-within { width: auto; height: auto; clip: auto; left: 16px; top: 120px; z-index: 45; display: grid; gap: 4px; background: var(--panel); padding: 8px; }

/* Item window */
.overlay {
  position: absolute; inset: 0;
  z-index: 60;
  background: rgba(8, 6, 18, .72);
  display: grid; place-items: safe center;
  padding: 28px 16px;
  overflow: auto;
  perspective: 1100px;
}
.flip {
  width: min(680px, 100%);
  transform-style: preserve-3d;
  animation: flipin .55s cubic-bezier(.2,.9,.25,1.15) both;
}
@keyframes flipin {
  from { transform: rotateY(-110deg) rotateX(18deg) scale(.55); opacity: 0; }
  60%  { opacity: 1; }
  to   { transform: none; opacity: 1; }
}
.card {
  position: relative;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(calc(var(--ry, 0deg) + var(--turn, 0deg)));
  transition: transform .18s ease-out;
  background: var(--panel);
  box-shadow:
    0 0 0 4px #000,
    0 0 0 8px var(--ink),
    0 0 0 12px #000,
    12px 12px 0 12px rgba(0,0,0,.6);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
}
.card.turning { transition: transform .6s cubic-bezier(.3,1.4,.4,1); }
.card > .front { transform-style: preserve-3d; }
.card .art img  { transform: translateZ(70px); }
.card .art .big-yr { transform: translateZ(40px); }
.card .info > * { transform: translateZ(18px); }
.card .close { transform: translateZ(30px); }
/* swap faces at the halfway point of the turn; backface-visibility can't hide the 3D parallax layers */
.card > .front, .card .back { transition: visibility 0s .16s; }
.card:not(.is-flipped) .back, .card.is-flipped > .front { visibility: hidden; }
.card .glare {
  position: absolute; inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.22), rgba(255,255,255,0) 45%);
  mix-blend-mode: screen;
  transform: translateZ(2px);
}
.card .back {
  position: absolute; inset: 0;
  transform: rotateY(180deg) translateZ(-1px);
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.18) 0 8px, rgba(0,0,0,0) 8px 16px),
    var(--cbg);
  display: grid; place-items: center; align-content: center; gap: 18px;
  text-align: center;
  color: var(--clbl);
  padding: 24px;
}
.back .serial { font-family: var(--display); font-size: clamp(36px, 9vw, 72px); text-shadow: 5px 5px 0 rgba(0,0,0,.45); transform: translateZ(60px); }
.back .label  { font-family: var(--display); font-size: 11px; letter-spacing: .1em; transform: translateZ(30px); }
.back .bigsw  { display: flex; gap: 10px; transform: translateZ(40px); }
.back .bigsw span { width: 40px; height: 40px; box-shadow: inset 0 0 0 3px #000, 4px 4px 0 rgba(0,0,0,.5); }
.card .art {
  background: var(--cbg);
  display: grid; place-items: center;
  padding: 28px 16px;
  position: relative;
  min-height: 220px;
}
.card .art img {
  width: 100%; max-width: 260px;
  image-rendering: pixelated;
}
.card .art .big-yr {
  position: absolute; left: 14px; top: 14px;
  font-family: var(--display); font-size: 14px; color: var(--clbl);
}
.card .info { padding: 22px 22px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.tag {
  font-family: var(--display); font-size: 9px; letter-spacing: .08em;
  color: var(--gold);
}
.card h2 {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(13px, 2vw, 17px);
  line-height: 1.6;
  text-wrap: balance;
}
.card .nick { margin: -6px 0 0; color: var(--dim); font-size: 20px; }
.card .desc { margin: 0; font-size: 22px; line-height: 1.15; min-height: 3.5em; max-width: 34ch; }
.card .desc .cursor { animation: blink .7s steps(1) infinite; }
.stats { display: grid; gap: 6px; margin: 0; }
.stat { display: grid; grid-template-columns: 9.5ch 1fr; align-items: center; gap: 8px; }
.stat dt { font-family: var(--display); font-size: 9px; color: var(--dim); }
.stat dd { margin: 0; display: flex; gap: 3px; }
.stat dd.txt { font-size: 20px; line-height: 1; overflow-wrap: anywhere; }
.stat dd i { width: 14px; height: 12px; background: #2c2650; box-shadow: inset 0 0 0 2px #000; }
.stat dd i.on { background: var(--red); }
.swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.swatches span { width: 18px; height: 18px; box-shadow: inset 0 0 0 2px #000; }
.swatches small { font-family: var(--display); font-size: 9px; color: var(--dim); margin-right: 4px; }
.card .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.card .close { position: absolute; right: 12px; top: 12px; z-index: 2; }
.note { font-size: 16px; color: var(--dim); margin: 0; }

@media (max-width: 620px) {
  .card { grid-template-columns: 1fr; }
  .card .art { min-height: 0; padding: 36px 16px 20px; }
  .card .art img { max-width: 200px; }
  .hint { text-align: left; }
  .hud.bottom { flex-direction: column-reverse; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  .flip, .card, .card .art img, .hint .blink { animation: none; }
}
</style>

  </div>

      <button class="chip" data-f="epic" aria-pressed="false" style="--tc:#f2c14e">EPIC</button>
      <button class="chip" data-f="collab" aria-pressed="false" style="--tc:#ff8a2a">COLLAB</button>
      <button class="chip" data-f="rare" aria-pressed="false" style="--tc:#4cc3ff">RARE</button>
      <button class="chip" data-f="special" aria-pressed="false" style="--tc:#3ddc84">SPECIAL</button>
      <button class="chip" data-f="common" aria-pressed="false">COMMON</button>
    </div>
    <div class="hint">
      <span class="blink" id="hintText">DRAG TO SPIN · SCROLL TO ZOOM · CLICK TO INSPECT</span><br>
      Art by <a href="https://www.behance.net/gallery/142705389/AIR-JORDAN-1-COLLECTION" target="_blank" rel="noopener">MAUS MAUS · Behance</a>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="flip" id="flip">
    <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="c-name">
      <button class="pixbtn close front" id="close" aria-label="Close">X</button>
      <div class="art front"><span class="big-yr" id="c-yr"></span><img id="c-img" alt=""></div>
      <div class="info front">
        <span class="tag" id="c-tag"></span>
        <h2 id="c-name"></h2>
        <p class="nick" id="c-nick"></p>
        <p class="desc" id="c-desc" aria-live="polite"></p>
        <dl class="stats" id="c-stats"></dl>
        <div class="nav">
          <button class="pixbtn" id="prev">◀ PREV</button>
          <button class="pixbtn" id="next">NEXT ▶</button>
          <button class="pixbtn" id="flipbtn">FLIP ⟲</button>
        </div>
      </div>
      <div class="back" id="back" aria-hidden="true">
        <span class="label">AIR JORDAN 1 · PIXEL COLLECTION</span>
        <span class="serial" id="b-serial">#001</span>
        <div class="bigsw" id="b-sw"></div>
        <span class="label" id="b-name"></span>
        <button class="pixbtn" id="flipback">FLIP BACK ⟲</button>
      </div>
      <div class="glare"></div>
    </article>
    </div>
  </div>
</div>

    card.style.setProperty("--clbl", light ? "#111" : "#f4f1ea");
    const fl = $("flip");
    fl.style.animation = "none"; void fl.offsetWidth; fl.style.animation = "";
    setTurn(false);
    $("b-serial").textContent = "#" + String(p.i + 1).padStart(3, "0");
    $("b-name").textContent = `${p.name.toUpperCase()} · ${p.year}`;
    const img = thumb(p, 4);
    $("b-sw").innerHTML = `<img src="${img}" alt="" width="96" height="96">`;
    $("c-img").src = img;
    $("c-img").alt = `Pixel art of the Air Jordan 1 ${p.name}`;
    $("c-yr").textContent = "";
    $("c-tag").textContent = TIERS[p.tier].label;
    $("c-tag").style.color = p.tier === "common" ? "" : TIERS[p.tier].rim;
    $("c-name").textContent = p.name.toUpperCase();
    $("c-nick").textContent = p.code;
    $("sel").textContent = String(p.i + 1).padStart(3, "0");
    const esc = v => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    $("c-stats").innerHTML = [["STYLE", p.code], ["RELEASE", p.year], ["RETAIL", p.retail], ["TIER", TIERS[p.tier].label]]
      .map(([k, v]) => `<div class="stat"><dt>${k}</dt><dd class="txt">${esc(v)}</dd></div>`).join("");
    clearInterval(typer);
    const el = $("c-desc");
    if (reduce) { el.textContent = p.desc; return; }
    let n = 0;
    el.innerHTML = '<span class="cursor">█</span>';
    typer = setInterval(() => {
      n++;
      el.innerHTML = p.desc.slice(0, n).replace(/&/g, "&amp;").replace(/</g, "&lt;") + '<span class="cursor">█</span>';
      if (n % 3 === 0) blip(300 + Math.random() * 200, 0.02);
      if (n >= p.desc.length) clearInterval(typer);
    }, 22);
  }
  function step(dir) {
    const list = PAIRS.filter(match);
    const idx = list.indexOf(current);
    const p = list[(idx + dir + list.length) % list.length];
    const t = tiles.find(t => t.pair === p);
    opened = t;
    faceTile(t);
    show(p);
    blip(dir > 0 ? 990 : 740);
  }
  function close() {
    overlay.hidden = true;
    opened = null;
    clearInterval(typer);
    target = null; paused = false; goalX = rotX; goalY = rotY; vx = vy = 0;
    $("sel").textContent = "---";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    blip(440);
  }
  // 3D tilt follows the pointer; FLIP turns the card over
  const card = $("card");
  let flipped = false;
  function setTurn(on) {
    flipped = on;
    card.classList.toggle("is-flipped", on);
    card.classList.add("turning");
    card.style.setProperty("--turn", on ? "180deg" : "0deg");
    $("back").setAttribute("aria-hidden", on ? "false" : "true");
    setTimeout(() => card.classList.remove("turning"), 600);
  }
  overlay.addEventListener("pointermove", e => {
    if (reduce || e.pointerType === "touch") return;
    const r = card.getBoundingClientRect();
    const px = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const py = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    card.style.setProperty("--ry", ((px - 0.5) * (flipped ? -26 : 26)).toFixed(2) + "deg");
    card.style.setProperty("--rx", (-(py - 0.5) * 20).toFixed(2) + "deg");
    card.style.setProperty("--gx", (px * 100).toFixed(1) + "%");
    card.style.setProperty("--gy", (py * 100).toFixed(1) + "%");
  });
  overlay.addEventListener("pointerleave", () => {
    card.style.setProperty("--ry", "0deg");
    card.style.setProperty("--rx", "0deg");
  });
  $("flipbtn").addEventListener("click", () => { setTurn(true); blip(1040); });
  $("flipback").addEventListener("click", () => { setTurn(false); blip(780); });
  $("close").addEventListener("click", close);
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  addEventListener("keydown", e => {
    if (overlay.hidden) return;
    if (e.key === "Escape") close();
    if (e.key === "f" || e.key === "F") setTurn(!flipped);
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });
})();
</script>

</body>
</html>
